<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مكتبة الثانويه العامه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>مكتبة الثانويه العامه</h1>
    </header>



    

    <hr style="margin: 40px 0; border: none; border-top: 1px solid #ccc; padding-top: 40px;">
    <div class="padd">

        

    </div>
    <div class="login-platform">
        <h1>Log  in</h1>
        <form id="loginForm">
            <label for="username">اسم المستخدم:</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="اسم المستخدم">
            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="كلمة المرور">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <button type="submit" value="login" id="loginButton">تسجيل الدخول</button>
                <button type="submit" value="signup" id="signupButton">إنشاء حساب</button>
            </div>
        </form>
        <p id="loginMessage" style="color: red; text-align: center; margin-top: 10px;"></p>
    </div>

    <footer>
        <h3>مكتبة الثانوية العامة</h3>
        <p>جميع الحقوق محفوظة &copy; 2026 مكتبة الثانوية العامة</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
